<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef; --board: #bbada0; --cell: #cdc1b4; --text: #776e65;
    --size: min(92vw, 460px); --gap: calc(var(--size) * 0.03);
    --tile: calc((var(--size) - var(--gap) * 5) / 4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .wrap { width: var(--size); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: clamp(48px, 14vw, 72px); margin: 0; font-weight: 700; }
  .scores { display: flex; gap: 6px; }
  .score {
    background: var(--board); color: #fff; border-radius: 6px; padding: 6px 14px;
    text-align: center; min-width: 70px;
  }
  .score small { display: block; font-size: 12px; color: #eee4da; text-transform: uppercase; font-weight: 700; }
  .score span { font-size: 22px; font-weight: 700; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .bar p { margin: 0; font-size: 15px; }
  button {
    background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 6px;
    padding: 10px 18px; font-size: 16px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #9f8b77; }
  .board {
    position: relative; width: var(--size); height: var(--size); background: var(--board);
    border-radius: 8px; padding: var(--gap); touch-action: none; user-select: none;
  }
  .grid { display: grid; grid-template-columns: repeat(4, var(--tile)); gap: var(--gap); }
  .grid div { width: var(--tile); height: var(--tile); background: var(--cell); border-radius: 5px; }
  .tile {
    position: absolute; top: 0; left: 0; width: var(--tile); height: var(--tile); border-radius: 5px;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    transition: transform 110ms ease-in-out;
  }
  .tile .inner {
    width: 100%; height: 100%; border-radius: 5px; display: flex;
    align-items: center; justify-content: center;
  }
  .tile.new .inner { animation: appear 180ms ease 100ms backwards; }
  .tile.merged .inner { animation: pop 180ms ease 100ms backwards; }
  @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .overlay {
    position: absolute; inset: 0; border-radius: 8px; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(238, 228, 218, 0.73); z-index: 10; animation: fade 600ms ease;
  }
  .overlay.show { display: flex; }
  .overlay.win { background: rgba(237, 194, 46, 0.5); color: #f9f6f2; }
  .overlay h2 { margin: 0; font-size: clamp(36px, 10vw, 56px); }
  .overlay .btns { display: flex; gap: 8px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .help { margin-top: 20px; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><small>Score</small><span id="score">0</span></div>
      <div class="score"><small>Best</small><span id="best">0</span></div>
    </div>
  </header>
  <div class="bar">
    <p>Join the tiles, get to <strong>2048!</strong></p>
    <button id="newGame">New Game</button>
  </div>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayText"></h2>
      <div class="btns">
        <button id="keepGoing">Keep going</button>
        <button id="tryAgain">Try again</button>
      </div>
    </div>
  </div>
  <p class="help"><strong>How to play:</strong> Use your <strong>arrow keys</strong> (or W A S D, or swipe on a touchscreen) to move the tiles. When two tiles with the same number touch, they merge into one!</p>
</div>

<script>
const SIZE = 4;
const COLORS = {
  2: ["#eee4da", "#776e65"], 4: ["#ede0c8", "#776e65"], 8: ["#f2b179", "#f9f6f2"],
  16: ["#f59563", "#f9f6f2"], 32: ["#f67c5f", "#f9f6f2"], 64: ["#f65e3b", "#f9f6f2"],
  128: ["#edcf72", "#f9f6f2"], 256: ["#edcc61", "#f9f6f2"], 512: ["#edc850", "#f9f6f2"],
  1024: ["#edc53f", "#f9f6f2"], 2048: ["#edc22e", "#f9f6f2"],
};

const $ = id => document.getElementById(id);
const tilesEl = $("tiles");
let grid, score, best, won, keepPlaying, over, nextId;

function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

for (let i = 0; i < SIZE * SIZE; i++) $("grid").appendChild(document.createElement("div"));

function newGame() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  score = 0; won = false; keepPlaying = false; over = false; nextId = 1;
  best = load("best2048", 0);
  addRandom(); addRandom();
  render();
}

function emptyCells() {
  const cells = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) cells.push([r, c]);
  return cells;
}

function addRandom() {
  const cells = emptyCells();
  if (!cells.length) return;
  const [r, c] = cells[Math.floor(Math.random() * cells.length)];
  grid[r][c] = { id: nextId++, value: Math.random() < 0.9 ? 2 : 4, isNew: true };
}

// Move in a direction: 0=up, 1=right, 2=down, 3=left
function move(dir) {
  if (over || (won && !keepPlaying)) return;
  const vec = [[-1, 0], [0, 1], [1, 0], [0, -1]][dir];
  const rows = [...Array(SIZE).keys()], cols = [...Array(SIZE).keys()];
  if (vec[0] === 1) rows.reverse();
  if (vec[1] === 1) cols.reverse();

  let moved = false;
  for (const row of grid) for (const t of row) if (t) { t.isNew = false; t.merged = false; }
  const removed = [];

  for (const r of rows) for (const c of cols) {
    const tile = grid[r][c];
    if (!tile) continue;
    let nr = r, nc = c;
    while (true) {
      const tr = nr + vec[0], tc = nc + vec[1];
      if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
      const target = grid[tr][tc];
      if (!target) { nr = tr; nc = tc; continue; }
      if (target.value === tile.value && !target.merged) { nr = tr; nc = tc; }
      break;
    }
    if (nr === r && nc === c) continue;
    moved = true;
    grid[r][c] = null;
    const target = grid[nr][nc];
    if (target) {
      // Merge: the moving tile slides onto the target, then disappears
      removed.push({ ...tile, r: nr, c: nc });
      target.value *= 2; target.merged = true;
      score += target.value;
      if (target.value === 2048 && !won) won = true;
    } else {
      grid[nr][nc] = tile;
    }
  }

  if (!moved) return;
  addRandom();
  if (score > best) { best = score; save("best2048", best); }
  if (!canMove()) over = true;
  render(removed);
}

function canMove() {
  if (emptyCells().length) return true;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const v = grid[r][c].value;
    if (c < SIZE - 1 && grid[r][c + 1].value === v) return true;
    if (r < SIZE - 1 && grid[r + 1][c].value === v) return true;
  }
  return false;
}

function pos(r, c) {
  const step = "(var(--tile) + var(--gap))";
  return `translate(calc(var(--gap) + ${c} * ${step}), calc(var(--gap) + ${r} * ${step}))`;
}

function render(removed = []) {
  const existing = new Map([...tilesEl.children].map(el => [el.dataset.id, el]));
  const keep = new Set();

  const place = (t, r, c) => {
    let el = existing.get(String(t.id));
    if (!el) {
      el = document.createElement("div");
      el.className = "tile";
      el.dataset.id = t.id;
      el.innerHTML = '<div class="inner"></div>';
      el.style.transform = pos(r, c);
      tilesEl.appendChild(el);
    }
    keep.add(String(t.id));
    el.style.transform = pos(r, c);
    el.classList.toggle("new", !!t.isNew);
    el.classList.remove("merged");
    if (t.merged) { void el.offsetWidth; el.classList.add("merged"); }
    const [bg, fg] = COLORS[t.value] || ["#3c3a32", "#f9f6f2"];
    const inner = el.firstChild;
    inner.style.background = bg; inner.style.color = fg;
    const digits = String(t.value).length;
    inner.style.fontSize = `calc(var(--tile) * ${digits <= 2 ? 0.48 : digits === 3 ? 0.4 : 0.32})`;
    inner.style.boxShadow = t.value >= 128 ? "0 0 20px rgba(243, 215, 116, 0.4)" : "none";
    inner.textContent = t.value;
    el.style.zIndex = t.merged ? 3 : 2;
    return el;
  };

  // Tiles absorbed in a merge slide to their spot, then get removed
  for (const t of removed) {
    const el = existing.get(String(t.id));
    if (!el) continue;
    keep.add(String(t.id));
    el.style.transform = pos(t.r, t.c);
    el.style.zIndex = 1;
    setTimeout(() => el.remove(), 110);
  }
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c]) place(grid[r][c], r, c);
  for (const [id, el] of existing) if (!keep.has(id)) el.remove();

  $("score").textContent = score;
  $("best").textContent = best;

  const overlay = $("overlay");
  if (won && !keepPlaying) {
    overlay.className = "overlay show win";
    $("overlayText").textContent = "You win!";
    $("keepGoing").style.display = "";
  } else if (over) {
    overlay.className = "overlay show";
    $("overlayText").textContent = "Game over!";
    $("keepGoing").style.display = "none";
  } else {
    overlay.className = "overlay";
  }
}

const KEYS = {
  ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3,
  w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3,
};
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key in KEYS) { e.preventDefault(); move(KEYS[e.key]); }
});

let start = null;
const board = $("board");
board.addEventListener("pointerdown", e => { start = [e.clientX, e.clientY]; });
board.addEventListener("pointerup", e => {
  if (!start) return;
  const dx = e.clientX - start[0], dy = e.clientY - start[1];
  start = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
});

$("newGame").onclick = newGame;
$("tryAgain").onclick = newGame;
$("keepGoing").onclick = () => { keepPlaying = true; render(); };

newGame();
</script>
</body>
</html>
